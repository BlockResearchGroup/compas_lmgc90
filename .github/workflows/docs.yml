name: docs

on:
  push:
    branches:
      - main
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  docs:
    runs-on: ubuntu-latest
    env:
      LMGC90_GIT_URL: ${{ secrets.LMGC90_GIT_URL }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          submodules: recursive

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y gfortran cmake libopenblas-dev liblapack-dev

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - uses: compas-dev/compas-actions.docs@v4
        with:
           github_token: ${{ secrets.GITHUB_TOKEN }}
           doc_url: https://BlockResearchGroup.github.io/compas_lmgc90