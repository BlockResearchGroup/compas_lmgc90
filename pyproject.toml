[build-system]
requires = ["scikit-build-core >=0.10", "nanobind >=1.3.2"]
build-backend = "scikit_build_core.build"

[project]
name = "compas_lmgc90"
description = "Binding for LMGC90."
readme = "README.md"
requires-python = ">=3.9"
dependencies = [
    "numpy >= 1.21.0",
    "compas >= 2",
    "compas_dem",
    "compas_viewer",
]
dynamic = ["version"]
authors = [
    { name = "Petras Vestartas", email = "petrasvestartas@gmail.com" },
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Topic :: Scientific/Engineering",
    "Operating System :: Unix",
    "Operating System :: POSIX",
    "Operating System :: Microsoft :: Windows",
    "Programming Language :: Python",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: C++",
    "License :: OSI Approved :: MIT License"
]

[project.optional-dependencies]
dev = [
    "attrs >= 17.4",
    "black >= 22.12.0",
    "bump-my-version",
    "compas_invocations2",
    "invoke >= 0.14",
    "ruff",
    "sphinx_compas2_theme",
    "twine",
    "wheel",
    "scikit-build-core",
    "nanobind",
    "build",
]

[project.urls]
Homepage = "https://github.com/BlockResearchGroup/compas_lmgc90"
Repository = "https://github.com/BlockResearchGroup/compas_lmgc90"
Issues = "https://github.com/BlockResearchGroup/compas_lmgc90/issues"

# ============================================================================
# pytest configuration
# ============================================================================

[tool.pytest.ini_options]
minversion = "6.0"
testpaths = ["tests", "src/compas_lmgc90"]
python_files = ["test_*.py", "*_test.py", "test.py"]
norecursedirs = [
    "external/*",
    "build/*",
    "dist/*",
    "*.egg-info",
    ".git",
    ".tox",
    ".env",
    ".pytest_cache",
    ".ruff_cache"
]
addopts = [
    "-ra",
    "--strict-markers",
    "--doctest-glob=*.rst",
    "--tb=short",
    "--import-mode=importlib"
]
doctest_optionflags = [
    "NORMALIZE_WHITESPACE",
    "IGNORE_EXCEPTION_DETAIL",
    "ALLOW_UNICODE",
    "ALLOW_BYTES",
    "NUMBER"
]

# ============================================================================
# scikit-build configuration
# ============================================================================

[tool.scikit-build]
minimum-version = "build-system.requires"
build-dir = "build/{wheel_tag}"
cmake.version = ">=3.15"
cmake.build-type = "Release"
sdist.exclude = ["external", ".venv", "build", "OUTBOX", "temp"]

[tool.scikit-build.metadata.version]
provider = "scikit_build_core.metadata.regex"
input = "src/compas_lmgc90/__init__.py"

[[tool.scikit-build.overrides]]
if.platform-system = "^win32"
cmake.args = ["-G", "Ninja"]
# Compilers are bootstrapped from cmake/BootstrapWindowsToolchain.cmake.
# Strip stray bin/, lib/, include/, modules/ directories that LMGC90's
# vendored Clipper2 (and any future FetchContent sub-project) installs at
# the wheel root using GNUInstallDirs. The functional artifacts all live
# under compas_lmgc90/ via our explicit install rules.
wheel.exclude = [
    "bin/**",
    "lib/**",
    "include/**",
    "modules/**",
    "share/**",
]

# macOS: compilers are auto-detected by CMakeLists.txt's Apple/Homebrew
# block (gcc-<major> via `brew --prefix`). We deliberately do NOT pin
# CMAKE_<LANG>_COMPILER from scikit-build here because the previous
# override mixed clang++ (Apple libc++) with Homebrew gfortran (Homebrew
# libgcc_s), which could link but was a runtime ABI minefield. BLAS comes
# from Apple Accelerate (driven by LMGC90's BLA_VENDOR=Apple).

[tool.scikit-build.cmake.define]
CMAKE_POLICY_DEFAULT_CMP0135 = "NEW"

# ============================================================================
# cibuildwheel configuration
# ============================================================================

[tool.cibuildwheel]
build-verbosity = 3
test-requires = ["numpy", "compas", "compas_dem", "pytest"]
# Import smoke test that actually loads _lmgc90.pyd — this is the whole
# point of shipping a Windows wheel and a green CI run is meaningless if
# `import _lmgc90` raises a DLL-load error. The reinit test is the
# regression guard for the "Rhino crashes the second time you run the
# script" class of bug: it instantiates LMGC90Solver multiple times in
# the same process and would segfault if our wrapper's clean_memory
# plumbing regressed. NOT wrapped in `|| echo` — any failure must fail
# CI loudly. cibuildwheel joins list-form test-command entries with
# `&&`, so a trailing `|| echo skip` on a later entry would mask earlier
# failures too.
test-command = [
    "python -c \"import compas_lmgc90; import compas_lmgc90._lmgc90; print('compas_lmgc90', compas_lmgc90.__version__, 'imported OK')\"",
    "python -m pytest {project}/tests/test_reinit.py::test_reinit_lowlevel -v",
    "python -m pytest {project}/tests/test_reinit.py::test_reinit_lowlevel_implicit_finalize -v",
]
# LMGC90_GIT_URL holds the (private) GitLab URL with credentials. CMake
# reads it during configure to clone LMGC90 via FetchContent. On Linux,
# cibuildwheel runs inside a Docker container that doesn't inherit the
# host env by default; environment-pass forwards the variable into it.
environment-pass = ["LMGC90_GIT_URL"]
build-frontend = "pip"
# AlmaLinux 8 (glibc 2.28, GCC 12). Needed because scipy >=1.17 dropped manylinux2014
# wheels — our runtime deps pull scipy, and we'd otherwise hit source builds during
# the test phase. manylinux_2_28 has scipy wheels for cp311..cp314.
manylinux-x86_64-image = "manylinux_2_28"
# Skip unsupported platforms. cp39 is required for Rhino 8 (it ships
# Python 3.9.10 / 3.9.12 with stock CPython ABI), so we keep cp39-cp313.
# cp38 stays skipped — many wheel deps have dropped 3.8.
skip = ["*_i686", "*-musllinux_*", "*-win32", "pp*", "cp36-*", "cp37-*", "cp38-*"]

# Linux: Install gfortran and LAPACK/BLAS in the manylinux container.
[tool.cibuildwheel.linux]
before-all = "dnf install -y gcc-gfortran openblas-devel lapack-devel"
environment = { CMAKE_BUILD_PARALLEL_LEVEL = "2", LMGC90_GIT_URL = "$LMGC90_GIT_URL" }

# macOS: BLAS/LAPACK comes from Apple's Accelerate framework (resolved
# via LMGC90's BLA_VENDOR=Apple), so we only need Homebrew gcc for the
# Fortran compiler — no openblas brew install. Delocate still bundles
# libgfortran/libgcc_s/libstdc++/libquadmath but no libomp.dylib.
#
# arm64-only, pinned to macos-14 so Homebrew bottles target 14.0 — must
# match MACOSX_DEPLOYMENT_TARGET.
[tool.cibuildwheel.macos]
archs = ["arm64"]
before-all = "brew install gcc"
environment = { CMAKE_BUILD_PARALLEL_LEVEL = "2", LMGC90_GIT_URL = "$LMGC90_GIT_URL", MACOSX_DEPLOYMENT_TARGET = "14.0" }
# Default delocate, plus a guard that fails if any OpenMP runtime slipped
# back into the wheel (the v0.1.8 regression that produced OMP: Error #15
# in conda envs with NumPy/MKL preloading libomp).
repair-wheel-command = [
    "delocate-wheel --require-archs {delocate_archs} -w {dest_dir} -v {wheel}",
    "python -c \"import sys, zipfile, glob, os; whl=sorted(glob.glob(os.path.join('{dest_dir}','*.whl')))[-1]; bad=[n for n in zipfile.ZipFile(whl).namelist() if any(s in n.lower() for s in ('libomp','libgomp','libiomp'))]; sys.exit('OpenMP runtime in wheel: '+repr(bad)) if bad else print('OpenMP-runtime guard: clean')\"",
]

# Windows: CMake bootstrap fetches MinGW-w64 + OpenBLAS automatically.
# delvewheel bundles the OpenBLAS DLL into the wheel.
[tool.cibuildwheel.windows]
# We bundle every runtime DLL (OpenBLAS + MinGW toolchain runtimes) into
# _lmgc90.pyd via static linking; only libopenblas.dll ships separately,
# resolved by Python's altered DLL search path. No delvewheel needed.
repair-wheel-command = ""
environment = { CMAKE_BUILD_PARALLEL_LEVEL = "2", COMPAS_LMGC90_TOOLCHAIN_CACHE = "C:/toolchain-cache", LMGC90_GIT_URL = "$LMGC90_GIT_URL" }

# ============================================================================
# code style configuration
# ============================================================================

[tool.black]
line-length = 179

[tool.ruff]
line-length = 179
indent-width = 4
target-version = "py39"

[tool.ruff.lint]
select = ["E", "F", "I"]

[tool.ruff.lint.isort]
known-first-party = ["compas", "compas_lmgc90"]
force-single-line = true
order-by-type = true

[tool.ruff.lint.per-file-ignores]
"__init__.py" = ["I001"]
"tests/*" = ["I001"]
"tasks.py" = ["I001"]
"docs/examples/*.py" = []

[tool.ruff.lint.pydocstyle]
convention = "numpy"

[tool.ruff.lint.pycodestyle]
max-doc-length = 179

[tool.ruff.format]
docstring-code-format = true
docstring-code-line-length = "dynamic"

# ============================================================================
# bumpversion configuration
# ============================================================================

[tool.bumpversion]
current_version = "0.1.9"
message = "Bump version to {new_version}"
commit = true
tag = true

[[tool.bumpversion.files]]
filename = "src/compas_lmgc90/__init__.py"
search = "{current_version}"
replace = "{new_version}"

[[tool.bumpversion.files]]
filename = "CHANGELOG.md"
search = "Unreleased"
replace = "[{new_version}] {now:%Y-%m-%d}"


