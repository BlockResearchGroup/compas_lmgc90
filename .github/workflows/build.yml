name: build

on:
  push:
    branches:
      - main
      - windows_support
  pull_request:
    branches:
      - main
  workflow_dispatch:

jobs:
  build_wheels:
    name: cibuildwheel on ${{ matrix.platform }}
    runs-on: ${{ matrix.os }}
    env:
      BLA_VENDOR: OpenBLAS
      LMGC90_GIT_URL: ${{ secrets.LMGC90_GIT_URL }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            platform: manylinux
          - os: windows-latest
            platform: windows
          # - os: macos-latest
          #   platform: mac

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          submodules: recursive

      - name: Install system dependencies (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y gfortran cmake libopenblas-dev liblapack-dev

      - name: Install cibuildwheel
        run: pipx install cibuildwheel==2.23.1

      - name: Build wheels
        run: cibuildwheel --output-dir wheelhouse .

      - uses: actions/upload-artifact@v4
        with:
          name: wheels-${{ matrix.platform }}
          path: wheelhouse/*.whl

  build_sdist:
    name: Test source distribution
    runs-on: ubuntu-latest
    env:
      LMGC90_GIT_URL: ${{ secrets.LMGC90_GIT_URL }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Build SDist
        run: pipx run build --sdist

      - uses: actions/upload-artifact@v4
        with:
          name: sdist
          path: dist/*.tar.gz